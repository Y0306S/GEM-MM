[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-mm"
version = "0.1.0"
description = "GEM-MM: Entropy-guided multimodal preference alignment for VLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Yuanshan Chua", email = "YCHUA060@e.ntu.edu.sg" },
  { name = "Xuejiao Zhao", email = "xjzhao@ntu.edu.sg" },
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.51",
  "accelerate>=0.33",
  "peft>=0.12",
  "datasets>=2.20",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
