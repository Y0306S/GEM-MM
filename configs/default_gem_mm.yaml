# Fair @3000 GEM-MM full fine-tune (primary recipe)
model_name: Qwen/Qwen3-VL-4B-Instruct
output_dir: outputs/gem_mm

k_candidates: 5
temperature: 0.9
sega_max_new_tokens: 192
sega_lr: 1.0e-5
lambda_weight: 2.0
top_m_ratio: 0.1
entropy_split_style: repo
prompt_style: repo_limit128

min_pixels: 200704
max_pixels: 401408

full_finetune: true
use_lora: false
gradient_checkpointing: true
max_steps: 3000
save_every_n_steps: 500
seed: 42

train_file: data/mm_rlhf_train_gem.jsonl
eval_pref_file: data/mm_rlhf_eval_pref.jsonl
image_root: ""
